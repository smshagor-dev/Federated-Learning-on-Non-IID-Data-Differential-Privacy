name: v3 supply chain

on:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "scripts/generate_v3_sbom.py"
      - ".github/workflows/v3-supply-chain.yml"
  push:
    branches: [federated-platform-expansion]

permissions:
  contents: read

jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install declared package dependencies
        run: python -m pip install -e './python[dev,security]'
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Generate deterministic dependency inventory
        run: python scripts/generate_v3_sbom.py --output artifacts/v3-python-sbom.cdx.json
      - name: Validate SBOM structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('artifacts/v3-python-sbom.cdx.json').read_text())
          if payload.get('bomFormat') != 'CycloneDX' or payload.get('specVersion') != '1.5':
              raise SystemExit('invalid SBOM metadata')
          if not payload.get('components'):
              raise SystemExit('SBOM contains no dependency components')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-python-sbom
          path: artifacts/v3-python-sbom.cdx.json
          if-no-files-found: error
