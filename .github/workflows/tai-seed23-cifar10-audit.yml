name: IEEE TAI independent CIFAR10 seed23 raw archive audit
on:
  push:
    branches: [research/tai-seed23-confirmatory-20261111]
    paths: [.github/workflows/tai-seed23-cifar10-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the three completed original-run metrics archives
        run: |
          gh run download 43036134413 --repo "$GITHUB_REPOSITORY" --pattern 'tai-seed23-metrics-CIFAR10-*' --dir recovered
          test "$(find recovered -name result.json | wc -l)" -eq 3
          find recovered -name result.json -print
      - name: Install exact analysis dependencies
        run: |
          python -m pip install 'torch==2.15.0' 'torchvision==0.29.2' 'numpy==2.4.6' 'matplotlib==3.11.2' 'pyyaml==6.0.3'
      - name: Independently audit raw predictions and partitions
        run: |
          python scripts/audit_tai_primary_collection.py recovered --output-dir audit
          python scripts/tai_confirmatory_inference.py audit/verified_primary_and_rq4.csv --output audit/seed23_inference_gate.json
          python - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(open('audit/verified_primary_and_rq4.csv',newline='')))
          assert len(rows)==3,rows
          assert {r['dataset'] for r in rows}=={'CIFAR10'}
          assert {r['method'] for r in rows}=={'fedavg','ditto','per_fedavg'}
          assert {int(r['seed']) for r in rows}=={23}
          assert {r['condition'] for r in rows}=={'dirichlet:0.1'}
          assert len({r['source_commit_sha'] for r in rows})==1
          assert len({r['train_partition_hash'] for r in rows})==1
          assert len({r['test_partition_hash'] for r in rows})==1
          assert all(len(r['train_partition_hash'])==64 and len(r['test_partition_hash'])==64 for r in rows)
          report=json.loads(Path('audit/coverage.json').read_text())
          assert report['primary']['verified']==3
          assert report['statistical_tests_executed'] is False
          gate=json.loads(Path('audit/seed23_inference_gate.json').read_text())
          assert gate['status']=='INSUFFICIENT_PAIRED_SEEDS_NO_PVALUES'
          assert all('exact_two_sided_signflip_p' not in v for v in gate['tests'].values())
          PY
      - name: Upload independently verified evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-seed23-cifar10-independent-audit
          path: audit/
          retention-days: 90
          if-no-files-found: warn
