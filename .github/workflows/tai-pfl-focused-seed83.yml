name: IEEE TAI focused CIFAR seed83 replication

# Six real 50-round seed83 cells; NOT a completion claim, a significance test,
# or a substitute for the separate 1680-cell full factorial protocol.
on:
  push:
    branches:
      - research/ieee-cifar-seed83-replication
    paths:
      - .github/workflows/tai-pfl-focused-seed83.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieee-tai-focused-cifar-seed83
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {dataset: CIFAR10, method: fedavg, seed: 83, shard: 1025}
          - {dataset: CIFAR10, method: ditto, seed: 83, shard: 1055}
          - {dataset: CIFAR10, method: per_fedavg, seed: 83, shard: 1065}
          - {dataset: CIFAR100, method: fedavg, seed: 83, shard: 1445}
          - {dataset: CIFAR100, method: ditto, seed: 83, shard: 1475}
          - {dataset: CIFAR100, method: per_fedavg, seed: 83, shard: 1485}
    env:
      DATASET: ${{ matrix.dataset }}
      METHOD: ${{ matrix.method }}
      SEED: ${{ matrix.seed }}
      SHARD: ${{ matrix.shard }}
      FROZEN_SHA: a6641509c2b8e6557101499db553177d70a6a3e2
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout immutable, previously audited training implementation
        uses: actions/checkout@v4
        with:
          ref: a6641509c2b8e6557101499db553177d70a6a3e2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.15.0' 'torchvision==0.29.2' 'numpy==2.4.6' 'matplotlib==3.11.2' 'pyyaml==6.0.3' 'pytest==9.2.0'
          mkdir -p evidence
          python -m pip freeze > evidence/pinned_environment.txt

      - name: Prove frozen source and exact cell identity before training
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SHA"
          python scripts/run_tai_1680.py --shard-count 1680 --shard-index "$SHARD" --max-cells 1 > evidence/expected-cell.json
          python - <<'PY'
          import json
          import os
          record = json.load(open("evidence/expected-cell.json", encoding="utf-8"))
          expected = [{
              "dataset": os.environ["DATASET"],
              "condition": "dirichlet:0.1",
              "method": os.environ["METHOD"],
              "seed": int(os.environ["SEED"]),
              "rounds": 50,
          }]
          assert record["expected_full_matrix"] == 1680, record
          assert record["assigned_shard_cells"] == 1, record
          assert record["exact_expected_cells"] == expected, (record, expected)
          PY

      - name: Preflight checksum-verified official dataset with bounded retry
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from torchvision.datasets import CIFAR10, CIFAR100

          dataset_name = os.environ["DATASET"]
          dataset_type = {"CIFAR10": CIFAR10, "CIFAR100": CIFAR100}[dataset_name]
          archive = {
              "CIFAR10": "cifar-10-python.tar.gz",
              "CIFAR100": "cifar-100-python.tar.gz",
          }[dataset_name]
          root = Path("data_raw")
          root.mkdir(parents=True, exist_ok=True)
          for attempt in range(1, 5):
              try:
                  train = dataset_type(root=str(root), train=True, download=True)
                  test = dataset_type(root=str(root), train=False, download=False)
                  assert len(train) > 0 and len(test) > 0
                  print(f"Integrity-verified official {dataset_name} train and test data", flush=True)
                  break
              except (RuntimeError, OSError, ConnectionError) as exc:
                  print(f"Download/integrity attempt {attempt}/4 failed: {exc}", flush=True)
                  (root / archive).unlink(missing_ok=True)
                  if attempt == 4:
                      raise
                  time.sleep(15 * attempt)
          PY

      - name: Train one genuine prespecified 50-round cell
        run: |
          timeout --signal=TERM --kill-after=20s 310m \
            python scripts/run_tai_1680.py \
              --shard-count 1680 --shard-index "$SHARD" --max-cells 1 \
              --execute --archive-incomplete --skip-complete \
              --root evidence/results --data-root data_raw

      - name: Check 50 rounds, exact source, original held-out clients
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tai_pfl.analysis import _check_cell, assert_primary_50round_protocol

          raw = list(Path("evidence/results").rglob("result.json"))
          assert len(raw) == 1, raw
          result = _check_cell(raw[0])
          assert_primary_50round_protocol(result)
          request = result["request"]
          assert (
              request["dataset"], request["partition"], request["method"],
              request["seed"], request["rounds"]
          ) == (
              os.environ["DATASET"], "dirichlet:0.1", os.environ["METHOD"],
              int(os.environ["SEED"]), 50
          )
          assert request["source_commit_sha"] == os.environ["FROZEN_SHA"]
          assert result["minimum_heldout_client_samples"] > 0
          receipt = {
              "status": "TRAINING_COMPLETE_AWAITING_INDEPENDENT_RAW_ARCHIVE_AUDIT",
              "run_id": result["run_id"],
              "source_sha": request["source_commit_sha"],
              "request": request,
              "metrics": result["metrics"],
          }
          Path("evidence/VERIFIED_TRAINING_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Finished original cell {result['run_id']}; independent audit pending")
          PY

      - name: Preserve SHA-256 of original checkpoint files
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("evidence/results")
          checksums = {}
          for model_file in sorted(root.rglob("*.pt")) if root.exists() else []:
              digest = hashlib.sha256()
              with model_file.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              checksums[str(model_file.relative_to(root))] = {
                  "sha256": digest.hexdigest(),
                  "bytes": model_file.stat().st_size,
              }
          Path("evidence/MODEL_SHA256.json").write_text(
              json.dumps(checksums, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve original numerical and partition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee-tai-focus-evidence-${{ matrix.dataset }}-${{ matrix.method }}-seed${{ matrix.seed }}
          path: |
            evidence/pinned_environment.txt
            evidence/expected-cell.json
            evidence/VERIFIED_TRAINING_RECEIPT.json
            evidence/MODEL_SHA256.json
            evidence/results/**/request.json
            evidence/results/**/result.json
            evidence/results/**/rounds.csv
            evidence/results/**/clients_deployed.csv
            evidence/results/**/clients_global.csv
            evidence/results/**/train_indices.npz
            evidence/results/**/test_indices.npz
            evidence/results/**/realized_heterogeneity.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

      - name: Preserve original checkpoints for independent hash audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ieee-tai-focus-models-${{ matrix.dataset }}-${{ matrix.method }}-seed${{ matrix.seed }}
          path: evidence/results/**/*.pt
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
