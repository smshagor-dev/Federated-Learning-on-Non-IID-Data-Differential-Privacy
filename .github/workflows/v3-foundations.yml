name: v3 foundations

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/v3/**"
      - "python/tests/test_v3_foundations.py"
      - "python/pyproject.toml"
      - "RELEASE_PLAN_v3.0.0.md"
      - ".github/workflows/v3-foundations.yml"
  push:
    branches: [federated-platform-expansion]

permissions:
  contents: read

jobs:
  python-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e './python[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile v3 package
        run: python -m compileall -q python/src/fl_platform/v3
      - name: Ruff v3 source and tests
        run: ruff check python/src/fl_platform/v3 python/tests/test_v3_foundations.py
      - name: Ruff formatting gate
        run: ruff format --check python/src/fl_platform/v3 python/tests/test_v3_foundations.py
      - name: Strict type check
        working-directory: python
        run: mypy src/fl_platform/v3
      - name: v3 foundation tests
        working-directory: python
        run: pytest -q tests/test_v3_foundations.py
      - name: Development version must not masquerade as release
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          if version != '3.0.0.dev0':
              raise SystemExit(f'unexpected v3 development version: {version}')
          PY
