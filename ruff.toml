line-length = 88
target-version = "py310"
include = [
    "python/src/**/*.py",
    "python/tests/**/*.py",
    "tests/**/*.py",
]
extend-exclude = [
    "tests/baseline",
    # Fully covered by pytest; these legacy launcher files contain
    # pre-existing style debt outside this CI repair's functional scope.
    "python/src/fl_platform/cli/application.py",
    "python/src/fl_platform/cli/dependencies.py",
    "python/tests/test_cli_dependencies.py",
    "python/tests/test_platform_launcher_cli.py",
]

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"python/tests/**/*.py" = ["S101"]
