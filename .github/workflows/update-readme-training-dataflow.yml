name: Update README training data flow

on:
  push:
    branches:
      - document-training-dataflow-live-simulator
    paths:
      - .github/workflows/update-readme-training-dataflow.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: document-training-dataflow-live-simulator
          fetch-depth: 0

      - name: Add data origin, training location, and simulator documentation
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          toc_marker = "- [System workflow](#system-workflow)"
          toc_replacement = (
              "- [System workflow](#system-workflow)\n"
              "- [Live simulator](#live-simulator)"
          )
          if text.count(toc_marker) != 1:
              raise SystemExit(
                  f"expected one System workflow TOC entry, found {text.count(toc_marker)}"
              )
          text = text.replace(toc_marker, toc_replacement, 1)

          marker = "### 11.4 Runtime boundary"
          if text.count(marker) != 1:
              raise SystemExit(
                  f"expected one runtime-boundary heading, found {text.count(marker)}"
              )

          insertion_b64 = ""
          insertion = base64.b64decode(insertion_b64).decode("utf-8")
          text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          checks = {
              "data-flow heading": "### 11.4 Where data comes from and where ML training happens" in updated,
              "live simulator heading": "## Live simulator" in updated,
              "live simulator TOC": "[Live simulator](#live-simulator)" in updated,
              "root data mermaid": "Root runtime data and training path" in updated,
              "distributed data mermaid": "Distributed worker data and training path" in updated,
              "runtime boundary renumbered": "### 11.5 Runtime boundary" in updated,
              "simulator command": "python scripts/live_fl_simulator.py --smoke" in updated,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("README validation failed: " + ", ".join(failed))
          print("README training/data-flow patch validated")
          PY

      - name: Validate documentation and simulator syntax
        shell: bash
        run: |
          git diff --check
          python -m py_compile scripts/live_fl_simulator.py
          python scripts/validate_repository_docs.py

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Shahanur Islam Shagor"
          git config user.email "smshagor.ru@gmail.com"
          git add README.md scripts/live_fl_simulator.py tests/test_live_fl_simulator.py
          git rm .github/workflows/update-readme-training-dataflow.yml
          git commit -m "Document FL data flow and live training simulator"
          git push origin HEAD:document-training-dataflow-live-simulator
