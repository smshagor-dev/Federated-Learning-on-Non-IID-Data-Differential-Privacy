name: v3 release artifacts

on:
  push:
    tags:
      - "v3.0.0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V3_RELEASE_IMAGE_LOCK_JSON: ${{ vars.V3_RELEASE_IMAGE_LOCK_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install release tooling
        run: |
          python -m pip install -e './python[security]'
          python -m pip install 'build>=1.2,<2'
      - name: Require exact final package version and tag parity
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path('python/pyproject.toml').read_text(encoding='utf-8')
          )['project']['version']
          if version != '3.0.0':
              raise SystemExit(
                  f'final release workflow requires package version 3.0.0; got {version}'
              )
          ref_type = os.environ.get('GITHUB_REF_TYPE', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          if ref_type == 'tag' and ref_name != f'v{version}':
              raise SystemExit(
                  f'tag/package version mismatch: tag={ref_name}, package={version}'
              )
          PY
      - name: Require complete immutable release image lock
        run: |
          if [ -z "${V3_RELEASE_IMAGE_LOCK_JSON}" ]; then
            echo "Repository variable V3_RELEASE_IMAGE_LOCK_JSON is required for v3.0.0."
            exit 1
          fi
          mkdir -p artifacts
          printf '%s' "${V3_RELEASE_IMAGE_LOCK_JSON}" > artifacts/v3-release-image-lock.json
          python scripts/render_v3_release_kubernetes.py \
            --lock artifacts/v3-release-image-lock.json \
            --output-dir artifacts/kubernetes-release
      - name: Verify every rendered Kubernetes image is digest-pinned
        run: |
          python - <<'PY'
          from pathlib import Path
          from fl_platform.v3.release_security import (
              discover_kubernetes_images,
              validate_immutable_image_reference,
          )

          images = discover_kubernetes_images(Path('artifacts/kubernetes-release'))
          for image in images:
              validate_immutable_image_reference(image)
          print(f'validated {len(images)} immutable Kubernetes image references')
          PY
      - name: Build final Python artifacts
        run: python -m build ./python --outdir artifacts/dist
      - name: Archive exact source commit and Kubernetes deployment bundle
        run: |
          git archive --format=tar.gz --output artifacts/fl-platform-source.tar.gz HEAD
          tar -czf artifacts/v3-kubernetes-release.tar.gz \
            -C artifacts/kubernetes-release .
      - name: Generate final SBOM
        run: python scripts/generate_v3_sbom.py --output artifacts/v3-python-sbom.cdx.json
      - name: Generate final artifact hash manifest
        run: |
          python scripts/generate_v3_release_manifest.py \
            --root . \
            --commit-sha "${GITHUB_SHA}" \
            --output artifacts/v3-release-manifest.json \
            artifacts/v3-python-sbom.cdx.json \
            artifacts/v3-release-image-lock.json \
            artifacts/v3-kubernetes-release.tar.gz \
            artifacts/fl-platform-source.tar.gz \
            artifacts/dist/*
      - name: Require release-ready provenance manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('artifacts/v3-release-manifest.json').read_text(encoding='utf-8')
          )
          if manifest['version'] != '3.0.0':
              raise SystemExit('release manifest version is not 3.0.0')
          if manifest['release_ready_version'] is not True:
              raise SystemExit('release artifact manifest is not release-ready')
          if manifest['commit_sha'] != '${{ github.sha }}'.lower():
              raise SystemExit('release manifest commit SHA mismatch')
          PY
      - name: Create release bundle
        run: |
          tar -czf artifacts/fl-platform-v3.0.0-release-bundle.tar.gz \
            -C artifacts \
            dist \
            v3-python-sbom.cdx.json \
            v3-release-image-lock.json \
            v3-kubernetes-release.tar.gz \
            fl-platform-source.tar.gz \
            v3-release-manifest.json
      - name: Attest release bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/fl-platform-v3.0.0-release-bundle.tar.gz
      - name: Attest Python artifacts with CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/dist/*
          sbom-path: artifacts/v3-python-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: fl-platform-v3.0.0-release-evidence
          path: |
            artifacts/fl-platform-v3.0.0-release-bundle.tar.gz
            artifacts/v3-release-manifest.json
            artifacts/v3-python-sbom.cdx.json
            artifacts/v3-release-image-lock.json
            artifacts/v3-kubernetes-release.tar.gz
            artifacts/dist/*
          if-no-files-found: error
          retention-days: 90
