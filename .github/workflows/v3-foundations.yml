name: v3 foundations

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/v3/**"
      - "python/src/fl_platform/privacy/**"
      - "python/src/fl_platform/secure_aggregation/**"
      - "python/src/fl_platform/execution/**"
      - "python/src/fl_platform/workers/**"
      - "python/tests/test_v3_foundations.py"
      - "python/tests/test_v3_runtime_integration.py"
      - "python/tests/test_v3_adversarial_robustness.py"
      - "python/tests/test_v3_privacy_validation.py"
      - "python/tests/test_v3_algorithm_suite.py"
      - "python/tests/test_secure_aggregation_threshold_recovery.py"
      - "python/tests/test_execution_foundations.py"
      - "python/tests/test_worker_service.py"
      - "python/pyproject.toml"
      - "RELEASE_PLAN_v3.0.0.md"
      - ".github/workflows/v3-foundations.yml"
  push:
    branches: [federated-platform-expansion]

concurrency:
  group: v3-foundations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e './python[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile v3 and execution integration
        run: |
          python -m compileall -q \
            python/src/fl_platform/v3 \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/execution \
            python/src/fl_platform/workers
      - name: Ruff v3 runtime source and tests
        run: |
          ruff check \
            python/src/fl_platform/v3 \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/execution/modes.py \
            python/src/fl_platform/execution/multiprocessing_orchestrator.py \
            python/src/fl_platform/workers \
            python/tests/test_v3_foundations.py \
            python/tests/test_v3_runtime_integration.py \
            python/tests/test_v3_adversarial_robustness.py \
            python/tests/test_v3_privacy_validation.py \
            python/tests/test_v3_algorithm_suite.py \
            python/tests/test_secure_aggregation_threshold_recovery.py \
            python/tests/test_execution_foundations.py \
            python/tests/test_worker_service.py
      - name: Ruff formatting gate
        run: |
          ruff format --check \
            python/src/fl_platform/v3 \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/execution/modes.py \
            python/src/fl_platform/execution/multiprocessing_orchestrator.py \
            python/src/fl_platform/workers \
            python/tests/test_v3_foundations.py \
            python/tests/test_v3_runtime_integration.py \
            python/tests/test_v3_adversarial_robustness.py \
            python/tests/test_v3_privacy_validation.py \
            python/tests/test_v3_algorithm_suite.py \
            python/tests/test_secure_aggregation_threshold_recovery.py \
            python/tests/test_execution_foundations.py \
            python/tests/test_worker_service.py
      - name: Strict type check
        working-directory: python
        run: |
          mypy \
            src/fl_platform/v3 \
            src/fl_platform/secure_aggregation/threshold_recovery.py \
            src/fl_platform/execution/modes.py \
            src/fl_platform/execution/multiprocessing_orchestrator.py \
            src/fl_platform/workers/service.py
      - name: v3 runtime integration tests
        working-directory: python
        run: |
          pytest -q \
            tests/test_v3_foundations.py \
            tests/test_v3_runtime_integration.py \
            tests/test_v3_adversarial_robustness.py \
            tests/test_v3_privacy_validation.py \
            tests/test_v3_algorithm_suite.py \
            tests/test_secure_aggregation_threshold_recovery.py \
            tests/test_execution_foundations.py \
            tests/test_worker_service.py
      - name: Development version must not masquerade as release
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          if version != '3.0.0.dev0':
              raise SystemExit(f'unexpected v3 development version: {version}')
          PY
