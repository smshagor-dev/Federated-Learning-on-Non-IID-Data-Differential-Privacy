name: v3 secure aggregation recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/secure_aggregation/threshold_recovery.py"
      - "python/src/fl_platform/secure_aggregation/dropout_recovery.py"
      - "python/tests/test_secure_aggregation_threshold_recovery.py"
      - "python/tests/test_secure_aggregation_dropout_recovery.py"
      - "docs/secure-aggregation-threshold-dropout-recovery.md"
      - ".github/workflows/v3-secure-aggregation-recovery.yml"
  push:
    branches: [secure-aggregation-recovery]

concurrency:
  group: v3-secagg-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dropout-recovery-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e './python[dev,security]'
      - name: Threshold/dropout lint
        run: |
          ruff check \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/secure_aggregation/dropout_recovery.py \
            python/tests/test_secure_aggregation_threshold_recovery.py \
            python/tests/test_secure_aggregation_dropout_recovery.py
      - name: Threshold/dropout formatting
        run: |
          ruff format --check \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/secure_aggregation/dropout_recovery.py \
            python/tests/test_secure_aggregation_threshold_recovery.py \
            python/tests/test_secure_aggregation_dropout_recovery.py
      - name: Threshold/dropout strict types
        working-directory: python
        run: |
          mypy \
            src/fl_platform/secure_aggregation/threshold_recovery.py \
            src/fl_platform/secure_aggregation/dropout_recovery.py
      - name: Threshold and dropout recovery tests
        working-directory: python
        run: |
          pytest -q \
            tests/test_secure_aggregation_threshold_recovery.py \
            tests/test_secure_aggregation_dropout_recovery.py
