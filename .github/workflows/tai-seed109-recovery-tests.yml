name: IEEE TAI seed109 recovery regression gate
on:
  push:
    branches: [research/ieee-seed109-cifar10-audit]
    paths:
      - scripts/recover_tai_focused_archives.py
      - tests/test_tai_focused_archive_recovery.py
      - .github/workflows/tai-seed109-recovery-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: python -m pytest -q tests/test_tai_focused_archive_recovery.py
      - run: python -m ruff check scripts/recover_tai_focused_archives.py tests/test_tai_focused_archive_recovery.py
