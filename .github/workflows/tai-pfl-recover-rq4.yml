name: IEEE TAI salvage RQ4 50-round adaptation evidence
# The original RQ4 job started with an unimportable direct-script verifier.
# If it finishes training and fails afterward, keep its trained checkpoint.
# Re-evaluate only adaptation steps 1, 3 and 5, without retraining 50 rounds.

on:
  push:
    branches:
      - research/tai-1680-primary-execution-20261110
    paths:
      - .github/workflows/tai-pfl-recover-rq4.yml
      - scripts/run_tai_rq4_from_primary.py
  workflow_run:
    workflows:
      - IEEE TAI RQ4 50-round sensitivity
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-verified-checkpoint-and-adaptation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.id == 42882897568
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install actual dataset evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision numpy matplotlib pyyaml pytest

      - name: Download immutable completed training artifact
        uses: actions/download-artifact@v4
        with:
          name: tai-pfl-rq4-50round-real-evidence
          run-id: 42882897568
          github-token: ${{ github.token }}
          path: rq4-artifacts

      - name: Verify 50 genuine training rounds before adaptation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tai_pfl.analysis import _check_cell
          source = Path("rq4-artifacts/primary/mnist/iid/11/per_fedavg")
          result = _check_cell(source / "result.json")
          request = result["request"]
          assert request["method"] == "per_fedavg"
          assert request["dataset"] == "MNIST"
          assert request["seed"] == 11
          assert request["partition"] == "iid"
          assert request["source_commit_sha"] == "5acdeb8b70b4d374c97c656d4448466c1911c17a"
          assert request["rounds"] == 50
          assert request["training"]["adaptation_steps"] == 1
          assert result["metrics"]["client_count"] == 20
          print("Recovered actual 50-round Per-FedAvg training", json.dumps(result["metrics"]))
          PY

      - name: Reproduce one step, then evaluate three/five steps on same weights
        run: |
          timeout --signal=TERM --kill-after=20s 65m \
            python -m scripts.run_tai_rq4_from_primary \
              --primary-cell rq4-artifacts/primary/mnist/iid/11/per_fedavg \
              --output-root rq4-artifacts/adaptation \
              --data-root data_raw \
              --steps 3 5

      - name: Independently audit all sensitivity outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tai_pfl.analysis import _check_cell

          base = _check_cell(Path(
              "rq4-artifacts/primary/mnist/iid/11/per_fedavg/result.json"
          ))
          found = sorted(Path("rq4-artifacts/adaptation").rglob("result.json"))
          assert len(found) == 2
          results = []
          for p in found:
              value = _check_cell(p)
              a, b = value["request"], base["request"]
              assert value["source_primary_run_id"] == base["run_id"]
              assert value["training_reused_from_primary"] is True
              assert a["rounds"] == 50
              assert a["train_partition_hash"] == b["train_partition_hash"]
              assert a["test_partition_hash"] == b["test_partition_hash"]
              results.append(value)
          assert {x["request"]["training"]["adaptation_steps"] for x in results} == {3, 5}
          summary = {
              "status": "RQ4_REAL_DATA_SINGLE_SEED_DESCRIPTIVE_ONLY",
              "dataset": "MNIST",
              "condition": "iid",
              "seed": 11,
              "rounds": 50,
              "primary_accuracy": base["metrics"],
              "derived": {
                  str(x["request"]["training"]["adaptation_steps"]): x["metrics"]
                  for x in results
              },
              "statistical_inference_valid": False,
              "primary_matrix_complete": False,
          }
          dest = Path("rq4-artifacts/VERIFIED_RQ4_SENSITIVITY.json")
          dest.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Preserve original and derived RQ4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-pfl-rq4-recovered-verified
          path: rq4-artifacts/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 1
