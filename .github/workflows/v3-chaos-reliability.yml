name: v3 chaos reliability

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/v3/chaos_reliability.py"
      - "python/tests/test_v3_chaos_reliability.py"
      - "scripts/run_v3_chaos_soak.py"
      - ".github/workflows/v3-chaos-reliability.yml"
  push:
    branches: [chaos-reliability]
  schedule:
    - cron: "17 3 * * 2,5"

concurrency:
  group: v3-chaos-reliability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chaos-contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e './python[dev]'
      - name: Chaos lint
        run: |
          ruff check \
            python/src/fl_platform/v3/chaos_reliability.py \
            python/tests/test_v3_chaos_reliability.py \
            scripts/run_v3_chaos_soak.py
      - name: Chaos formatting
        run: |
          ruff format --check \
            python/src/fl_platform/v3/chaos_reliability.py \
            python/tests/test_v3_chaos_reliability.py \
            scripts/run_v3_chaos_soak.py
      - name: Chaos strict types
        working-directory: python
        run: mypy src/fl_platform/v3/chaos_reliability.py
      - name: Chaos unit and seeded-soak invariants
        working-directory: python
        run: pytest -q tests/test_v3_chaos_reliability.py
      - name: Generate PR chaos-soak evidence
        run: |
          python scripts/run_v3_chaos_soak.py \
            --seeds 250 \
            --clients 32 \
            --output artifacts/v3-chaos-soak.json
      - name: Validate PR chaos-soak evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('artifacts/v3-chaos-soak.json').read_text(encoding='utf-8')
          )
          if payload['invariant_failures'] != 0:
              raise SystemExit('chaos soak reported invariant failures')
          if (
              payload['recovered_clients']
              + payload['dropped_clients']
              + payload['failed_clients']
              != payload['selected_clients']
          ):
              raise SystemExit('chaos soak client accounting mismatch')
          if not 0.0 <= payload['mean_recovery_rate'] <= 1.0:
              raise SystemExit('invalid chaos recovery rate')
          if 'not distributed-process/network chaos evidence' not in payload['scope']:
              raise SystemExit('chaos artifact lost its explicit scope boundary')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-chaos-soak-pr
          path: artifacts/v3-chaos-soak.json
          retention-days: 14

  chaos-scheduled-soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        run: python -m pip install -e ./python
      - name: Run larger deterministic soak
        run: |
          python scripts/run_v3_chaos_soak.py \
            --seeds 2000 \
            --clients 64 \
            --output artifacts/v3-chaos-soak-scheduled.json
      - name: Validate scheduled soak
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('artifacts/v3-chaos-soak-scheduled.json').read_text(
                  encoding='utf-8'
              )
          )
          if payload['invariant_failures'] != 0:
              raise SystemExit('scheduled chaos soak reported invariant failures')
          if (
              payload['recovered_clients']
              + payload['dropped_clients']
              + payload['failed_clients']
              != payload['selected_clients']
          ):
              raise SystemExit('scheduled chaos soak client accounting mismatch')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-chaos-soak-scheduled
          path: artifacts/v3-chaos-soak-scheduled.json
          retention-days: 30
