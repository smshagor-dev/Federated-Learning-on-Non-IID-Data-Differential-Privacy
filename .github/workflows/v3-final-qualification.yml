name: v3 final qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "RELEASE_PLAN_v3.0.0.md"
      - "RELEASE_NOTES_v3.0.0.md"
      - "release/**"
      - "python/pyproject.toml"
      - "python/src/fl_platform/__init__.py"
      - "python/src/fl_platform/v3/**"
      - "python/tests/test_v3_release_support.py"
      - "scripts/run_benchmark_matrix.py"
      - "scripts/validate_v3_release_benchmark.py"
      - "scripts/generate_v3_release_gate_evidence.py"
      - ".github/workflows/v3-final-qualification.yml"
      - ".github/workflows/v3-release-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "RELEASE_PLAN_v3.0.0.md"
      - "RELEASE_NOTES_v3.0.0.md"
      - "release/**"
      - "python/pyproject.toml"
      - "python/src/fl_platform/__init__.py"
      - "python/src/fl_platform/v3/**"
      - "python/tests/test_v3_release_support.py"
      - "scripts/run_benchmark_matrix.py"
      - "scripts/validate_v3_release_benchmark.py"
      - "scripts/generate_v3_release_gate_evidence.py"
      - ".github/workflows/v3-final-qualification.yml"
      - ".github/workflows/v3-release-artifacts.yml"
  workflow_dispatch:

concurrency:
  group: v3-final-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  support-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and qualification tooling
        run: python -m pip install -e './python[dev,security]'
      - name: Validate final version parity
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(
              Path('python/pyproject.toml').read_text(encoding='utf-8')
          )
          namespace = {}
          exec(
              Path('python/src/fl_platform/__init__.py').read_text(encoding='utf-8'),
              namespace,
          )
          package_version = pyproject['project']['version']
          module_version = namespace['__version__']
          if package_version != '3.0.0' or module_version != '3.0.0':
              raise SystemExit(
                  f'final version parity failed: project={package_version}, '
                  f'module={module_version}'
              )
          PY
      - name: Lint release qualification surface
        run: |
          ruff check \
            python/src/fl_platform/v3/release_support.py \
            python/tests/test_v3_release_support.py \
            scripts/validate_v3_release_benchmark.py \
            scripts/generate_v3_release_gate_evidence.py
      - name: Format release qualification surface
        run: |
          ruff format --check \
            python/src/fl_platform/v3/release_support.py \
            python/tests/test_v3_release_support.py \
            scripts/validate_v3_release_benchmark.py \
            scripts/generate_v3_release_gate_evidence.py
      - name: Strict types for support contract
        working-directory: python
        run: mypy src/fl_platform/v3/release_support.py
      - name: Test support contract and release security
        working-directory: python
        run: |
          pytest -q \
            tests/test_v3_release_support.py \
            tests/test_v3_release_security.py \
            tests/test_v3_foundations.py

  real-release-benchmark:
    needs: support-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and root runtime dependencies
        run: |
          python -m pip install -e './python[dev]'
          python -m pip install \
            'torch>=2.0.0' \
            'torchvision>=0.15.0' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'numpy>=1.24.0' \
            'scipy>=1.10.0' \
            'matplotlib>=3.7.0' \
            'seaborn>=0.12.0' \
            'pandas>=2.2.0' \
            'PyYAML>=6.0'
          python -m pip check
      - name: Run real five-seed stable baseline
        run: |
          python scripts/run_benchmark_matrix.py \
            --config release/v3.0.0-benchmark.yaml \
            --benchmark-id v3-release-baseline \
            --datasets MNIST \
            --algorithms fedavg \
            --partitions iid \
            --epsilons none \
            --seeds 11,23,37,53,71 \
            --rounds 1 \
            --output-dir artifacts/v3-release-benchmark \
            --minimum-replicates 5 \
            --bootstrap-samples 1000
      - name: Validate commit-bound empirical benchmark evidence
        run: |
          python scripts/validate_v3_release_benchmark.py \
            --benchmark-root artifacts/v3-release-benchmark/v3-release-baseline \
            --commit-sha "${GITHUB_SHA}" \
            --output artifacts/v3-release-benchmark-evidence.json
      - name: Generate machine-readable gate qualification evidence
        run: |
          python scripts/generate_v3_release_gate_evidence.py \
            --benchmark-evidence artifacts/v3-release-benchmark-evidence.json \
            --commit-sha "${GITHUB_SHA}" \
            --output artifacts/v3-release-gate-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3-final-qualification-evidence
          path: |
            artifacts/v3-release-benchmark/v3-release-baseline/plan.json
            artifacts/v3-release-benchmark/v3-release-baseline/status.json
            artifacts/v3-release-benchmark/v3-release-baseline/observations.json
            artifacts/v3-release-benchmark/v3-release-baseline/summary.json
            artifacts/v3-release-benchmark-evidence.json
            artifacts/v3-release-gate-evidence.json
          if-no-files-found: error
          retention-days: 90
