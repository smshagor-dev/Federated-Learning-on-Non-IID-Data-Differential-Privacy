# Masked Update Runtime and No-Dropout Secure FedAvg Finalization slice:
# a thin override on top of docker-compose.secure-cohort-handshake.yml
# that only changes FL_WORKER_RUN_ID, so this slice's live validation
# (scripts/validate_masked_update_runtime.py) targets its own run and
# its worker log output is never confused with the prior slice's
# handshake-only validation (scripts/validate_secure_cohort_handshake.py),
# even though both scripts tear down with `-v` and never run
# concurrently against the same stack. Every other setting (mTLS,
# signing, trust-bundle volume, secure aggregation windows) is
# unchanged from that file -- see its own header comment for the full
# rationale.
#
# Usage:
#   docker compose -f infra/compose/docker-compose.dev.yml \
#                   -f infra/compose/docker-compose.security.yml \
#                   -f infra/compose/docker-compose.secure-cohort-handshake.yml \
#                   -f infra/compose/docker-compose.masked-update-runtime.yml \
#                   up -d --build postgres redis coordinator api worker-1 worker-2 worker-3
#
# See scripts/validate_masked_update_runtime.py for the automated,
# scripted form of exactly this flow.
services:
  python-worker:
    environment:
      FL_WORKER_RUN_ID: masked-update-runtime-validation

  worker-2:
    environment:
      FL_WORKER_RUN_ID: masked-update-runtime-validation

  worker-3:
    environment:
      FL_WORKER_RUN_ID: masked-update-runtime-validation
