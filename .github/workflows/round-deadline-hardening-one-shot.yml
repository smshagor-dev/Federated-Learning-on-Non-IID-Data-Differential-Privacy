          # Small operator-facing documentation, appended once.
          docs = Path("docs/coordinator-runtime.md")
          docs_text = docs.read_text(encoding="utf-8")
          marker = "## Round deadline and retry fault tolerance"
          if marker not in docs_text:
              docs.write_text(
                  docs_text.rstrip()
                  + "\n\n## Round deadline and retry fault tolerance\n\n"
                  + "Distributed rounds now use `round_timeout_seconds` as an absolute wall-clock deadline. "
                  + "`minimum_valid_results` is a deadline/settlement quorum, not a fastest-client early-release target. "
                  + "Before the deadline the coordinator waits for the full selected cohort unless all remaining tasks are permanently settled. "
                  + "At the deadline unresolved clients are recorded as timed out; the accepted partial cohort is aggregated only when the quorum is met, otherwise the run fails without publishing a new model.\n\n"
                  + "The deadline, timeout classification, active leases, accepted results, and per-client retry-attempt counters are checkpointed. "
                  + "A coordinator restart therefore preserves both the original deadline and the remaining retry budget. "
                  + "The production gRPC server advances all runs from a watchdog even when no workers are polling; set `FL_ROUND_WATCHDOG_INTERVAL_MS` to a value from 1 to 60000 milliseconds (default `1000`).\n",
                  encoding="utf-8",
              )
