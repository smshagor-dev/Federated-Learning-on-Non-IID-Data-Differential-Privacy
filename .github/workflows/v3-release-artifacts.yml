name: v3 release artifacts

on:
  push:
    tags:
      - "v3.0.0"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/fl-platform-api
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/fl-platform-python-worker

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to belong to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Require successful same-SHA release qualification workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required_workflows=(
            ci.yml
            v3-release-candidate.yml
            v3-distributed-runtime.yml
            v3-final-qualification.yml
          )
          for workflow in "${required_workflows[@]}"; do
            run_id="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=success&per_page=100" \
                --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | .id" \
                | head -n 1
            )"
            if [ -z "${run_id}" ]; then
              echo "Missing successful ${workflow} run for ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "qualified ${workflow} with run ${run_id}"
            if [ "${workflow}" = "v3-final-qualification.yml" ]; then
              printf 'FINAL_QUALIFICATION_RUN_ID=%s\n' "${run_id}" >> "${GITHUB_ENV}"
            fi
          done
      - name: Download exact final-qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "${FINAL_QUALIFICATION_RUN_ID}"
          mkdir -p artifacts/qualification
          gh run download "${FINAL_QUALIFICATION_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name v3-final-qualification-evidence \
            --dir artifacts/qualification
          gate_evidence="$(find artifacts/qualification -type f \
            -name 'v3-release-gate-evidence.json' -print -quit)"
          benchmark_evidence="$(find artifacts/qualification -type f \
            -name 'v3-release-benchmark-evidence.json' -print -quit)"
          test -n "${gate_evidence}"
          test -n "${benchmark_evidence}"
          cp "${gate_evidence}" artifacts/v3-release-gate-evidence.json
          cp "${benchmark_evidence}" artifacts/v3-release-benchmark-evidence.json
      - name: Verify qualification evidence binding
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ['GITHUB_SHA'].lower()
          gate = json.loads(
              Path('artifacts/v3-release-gate-evidence.json').read_text(
                  encoding='utf-8'
              )
          )
          benchmark = json.loads(
              Path('artifacts/v3-release-benchmark-evidence.json').read_text(
                  encoding='utf-8'
              )
          )
          if gate.get('release') != '3.0.0':
              raise SystemExit('gate evidence release mismatch')
          if gate.get('qualification_complete') is not True:
              raise SystemExit('gate evidence is incomplete')
          if gate.get('commit_sha') != sha:
              raise SystemExit('gate evidence commit mismatch')
          if gate.get('gate_count') != 13:
              raise SystemExit('gate evidence does not cover all 13 gates')
          if benchmark.get('release') != '3.0.0':
              raise SystemExit('benchmark evidence release mismatch')
          if benchmark.get('evidence_complete') is not True:
              raise SystemExit('benchmark evidence is incomplete')
          if benchmark.get('commit_sha') != sha:
              raise SystemExit('benchmark evidence commit mismatch')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install release tooling
        run: |
          python -m pip install -e './python[security]'
          python -m pip install 'build>=1.2,<2'
      - name: Require exact final package version and tag parity
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path('python/pyproject.toml').read_text(encoding='utf-8')
          )['project']['version']
          if version != '3.0.0':
              raise SystemExit(
                  f'final release workflow requires package version 3.0.0; got {version}'
              )
          namespace = {}
          exec(
              Path('python/src/fl_platform/__init__.py').read_text(encoding='utf-8'),
              namespace,
          )
          if namespace['__version__'] != version:
              raise SystemExit('package/module version mismatch')
          ref_type = os.environ.get('GITHUB_REF_TYPE', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          if ref_type == 'tag' and ref_name != f'v{version}':
              raise SystemExit(
                  f'tag/package version mismatch: tag={ref_name}, package={version}'
              )
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/go-api.Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:3.0.0
          provenance: true
          sbom: true
      - name: Build and push Python worker image
        id: worker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python-worker.Dockerfile
          push: true
          tags: ${{ env.WORKER_IMAGE }}:3.0.0
          provenance: true
          sbom: true
      - name: Resolve immutable third-party image digests
        run: |
          docker pull postgres:16
          docker pull redis:7
          postgres_ref="$(docker image inspect postgres:16 --format='{{index .RepoDigests 0}}')"
          redis_ref="$(docker image inspect redis:7 --format='{{index .RepoDigests 0}}')"
          test -n "${postgres_ref}"
          test -n "${redis_ref}"
          printf 'POSTGRES_RELEASE_IMAGE=%s\n' "${postgres_ref}" >> "${GITHUB_ENV}"
          printf 'REDIS_RELEASE_IMAGE=%s\n' "${redis_ref}" >> "${GITHUB_ENV}"
      - name: Generate complete immutable release image lock
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker-image.outputs.digest }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              'API_DIGEST': os.environ.get('API_DIGEST', ''),
              'WORKER_DIGEST': os.environ.get('WORKER_DIGEST', ''),
              'POSTGRES_RELEASE_IMAGE': os.environ.get('POSTGRES_RELEASE_IMAGE', ''),
              'REDIS_RELEASE_IMAGE': os.environ.get('REDIS_RELEASE_IMAGE', ''),
          }
          missing = sorted(key for key, value in required.items() if not value)
          if missing:
              raise SystemExit(f'missing release image digest values: {missing}')

          for key in ('API_DIGEST', 'WORKER_DIGEST'):
              value = required[key]
              if not value.startswith('sha256:') or len(value) != 71:
                  raise SystemExit(f'{key} is not a sha256 OCI digest: {value!r}')

          lock = {
              'fl-platform/api:latest': (
                  f"{os.environ['API_IMAGE']}@{required['API_DIGEST']}"
              ),
              'fl-platform/python-worker:latest': (
                  f"{os.environ['WORKER_IMAGE']}@{required['WORKER_DIGEST']}"
              ),
              'postgres:16': required['POSTGRES_RELEASE_IMAGE'],
              'redis:7': required['REDIS_RELEASE_IMAGE'],
          }
          Path('artifacts/v3-release-image-lock.json').write_text(
              json.dumps(lock, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python scripts/render_v3_release_kubernetes.py \
            --lock artifacts/v3-release-image-lock.json \
            --output-dir artifacts/kubernetes-release
      - name: Verify every rendered Kubernetes image is digest-pinned
        run: |
          python - <<'PY'
          from pathlib import Path
          from fl_platform.v3.release_security import (
              discover_kubernetes_images,
              validate_immutable_image_reference,
          )

          images = discover_kubernetes_images(Path('artifacts/kubernetes-release'))
          if not images:
              raise SystemExit('rendered Kubernetes release contains no images')
          for image in images:
              validate_immutable_image_reference(image)
          print(f'validated {len(images)} immutable Kubernetes image references')
          PY
      - name: Build final Python artifacts
        run: python -m build ./python --outdir artifacts/dist
      - name: Archive exact source commit and Kubernetes deployment bundle
        run: |
          git archive --format=tar.gz --output artifacts/fl-platform-source.tar.gz HEAD
          tar -czf artifacts/v3-kubernetes-release.tar.gz \
            -C artifacts/kubernetes-release .
      - name: Generate final SBOM
        run: python scripts/generate_v3_sbom.py --output artifacts/v3-python-sbom.cdx.json
      - name: Generate final artifact hash manifest
        run: |
          python scripts/generate_v3_release_manifest.py \
            --root . \
            --commit-sha "${GITHUB_SHA}" \
            --output artifacts/v3-release-manifest.json \
            artifacts/v3-python-sbom.cdx.json \
            artifacts/v3-release-image-lock.json \
            artifacts/v3-release-gate-evidence.json \
            artifacts/v3-release-benchmark-evidence.json \
            artifacts/v3-kubernetes-release.tar.gz \
            artifacts/fl-platform-source.tar.gz \
            artifacts/dist/*
      - name: Require release-ready provenance manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('artifacts/v3-release-manifest.json').read_text(encoding='utf-8')
          )
          if manifest['version'] != '3.0.0':
              raise SystemExit('release manifest version is not 3.0.0')
          if manifest['release_ready_version'] is not True:
              raise SystemExit('release artifact manifest is not release-ready')
          if manifest['commit_sha'] != '${{ github.sha }}'.lower():
              raise SystemExit('release manifest commit SHA mismatch')
          PY
      - name: Create release bundle
        run: |
          tar -czf artifacts/fl-platform-v3.0.0-release-bundle.tar.gz \
            -C artifacts \
            dist \
            v3-python-sbom.cdx.json \
            v3-release-image-lock.json \
            v3-release-gate-evidence.json \
            v3-release-benchmark-evidence.json \
            v3-kubernetes-release.tar.gz \
            fl-platform-source.tar.gz \
            v3-release-manifest.json
      - name: Attest release bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/fl-platform-v3.0.0-release-bundle.tar.gz
      - name: Attest Python artifacts with CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/dist/*
          sbom-path: artifacts/v3-python-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: fl-platform-v3.0.0-release-evidence
          path: |
            artifacts/fl-platform-v3.0.0-release-bundle.tar.gz
            artifacts/v3-release-manifest.json
            artifacts/v3-python-sbom.cdx.json
            artifacts/v3-release-image-lock.json
            artifacts/v3-release-gate-evidence.json
            artifacts/v3-release-benchmark-evidence.json
            artifacts/v3-kubernetes-release.tar.gz
            artifacts/dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            artifacts/fl-platform-v3.0.0-release-bundle.tar.gz
            artifacts/v3-release-manifest.json
            artifacts/v3-python-sbom.cdx.json
            artifacts/v3-release-image-lock.json
            artifacts/v3-release-gate-evidence.json
            artifacts/v3-release-benchmark-evidence.json
            artifacts/v3-kubernetes-release.tar.gz
            artifacts/dist/*
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "v3.0.0" \
              --notes-file RELEASE_NOTES_v3.0.0.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "v3.0.0" \
              --notes-file RELEASE_NOTES_v3.0.0.md \
              "${assets[@]}"
          fi
