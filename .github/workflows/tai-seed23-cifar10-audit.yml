name: IEEE TAI independent CIFAR10+CIFAR100 seed23 raw archive audit
on:
  push:
    branches: [research/tai-seed23-confirmatory-20261111]
    paths: [.github/workflows/tai-seed23-cifar10-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the six completed original-run metrics archives
        run: |
          gh run download 43036134413 --repo "$GITHUB_REPOSITORY" --pattern 'tai-seed23-metrics-*' --dir recovered
          test "$(find recovered -name result.json | wc -l)" -eq 6
          find recovered -name result.json -print
      - name: Recover and SHA256-verify the original checkpoint archives
        run: |
          gh run download 43036134413 --repo "$GITHUB_REPOSITORY" --pattern 'tai-seed23-models-*' --dir recovered-models
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          for dataset in ('CIFAR10','CIFAR100'):
              for method in ('fedavg','ditto','per_fedavg'):
                  metrics=Path(f'recovered/tai-seed23-metrics-{dataset}-{method}')
                  manifest=json.loads((metrics/'model-sha256.json').read_text())
                  assert manifest and all(len(v)==64 for v in manifest.values()),(dataset,method,manifest)
                  expected=f'{dataset.lower()}/dirichlet-0.1/23/{method}/'
                  assert all(rel.startswith(expected) and rel.endswith('.pt') for rel in manifest),manifest
                  archive=Path(f'recovered-models/tai-seed23-models-{dataset}-{method}')
                  for rel,digest in manifest.items():
                      filename=Path(rel).name
                      candidates=list(archive.rglob(filename))
                      assert len(candidates)==1,(dataset,method,filename,candidates)
                      model=candidates[0]
                      assert hashlib.sha256(model.read_bytes()).hexdigest()==digest,(dataset,method,filename,'checkpoint hash mismatch')
                      destination=metrics/'results'/rel
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(model,destination)
                      assert hashlib.sha256(destination.read_bytes()).hexdigest()==digest
          PY
      - name: Install exact analysis dependencies
        run: |
          python -m pip install 'torch==2.15.0' 'torchvision==0.29.2' 'numpy==2.4.6' 'matplotlib==3.11.2' 'pyyaml==6.0.3'
      - name: Independently audit raw predictions and partitions
        run: |
          python scripts/audit_tai_primary_collection.py recovered --output-dir audit
          python scripts/tai_confirmatory_inference.py audit/verified_primary_and_rq4.csv --output audit/seed23_inference_gate.json
          python - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(open('audit/verified_primary_and_rq4.csv',newline='')))
          assert len(rows)==6,rows
          assert {r['dataset'] for r in rows}=={'CIFAR10','CIFAR100'}
          assert {r['method'] for r in rows}=={'fedavg','ditto','per_fedavg'}
          assert {int(r['seed']) for r in rows}=={23}
          assert {r['condition'] for r in rows}=={'dirichlet:0.1'}
          assert len({r['source_commit_sha'] for r in rows})==1
          assert all(len({r['train_partition_hash'] for r in rows if r['dataset']==d})==1 for d in ('CIFAR10','CIFAR100'))
          assert all(len({r['test_partition_hash'] for r in rows if r['dataset']==d})==1 for d in ('CIFAR10','CIFAR100'))
          assert all(len(r['train_partition_hash'])==64 and len(r['test_partition_hash'])==64 for r in rows)
          report=json.loads(Path('audit/coverage.json').read_text())
          assert report['primary']['verified']==6
          assert report['statistical_tests_executed'] is False
          gate=json.loads(Path('audit/seed23_inference_gate.json').read_text())
          assert gate['status']=='INSUFFICIENT_PAIRED_SEEDS_NO_PVALUES'
          assert all('exact_two_sided_signflip_p' not in v for v in gate['tests'].values())
          PY
      - name: Upload independently verified evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tai-seed23-sixcell-independent-audit
          path: audit/
          retention-days: 90
          if-no-files-found: warn
