name: v3 benchmark matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/benchmark/**"
      - "python/tests/test_v3_benchmark_matrix.py"
      - "python/tests/test_v3_benchmark_executable_gate.py"
      - "scripts/generate_v3_benchmark_manifest.py"
      - ".github/workflows/v3-benchmark.yml"
  push:
    branches: [benchmark-validation]

concurrency:
  group: v3-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e './python[dev]'
      - name: Benchmark lint
        run: |
          ruff check \
            python/src/fl_platform/benchmark \
            python/tests/test_v3_benchmark_matrix.py \
            python/tests/test_v3_benchmark_executable_gate.py \
            scripts/generate_v3_benchmark_manifest.py
      - name: Benchmark formatting
        run: |
          ruff format --check \
            python/src/fl_platform/benchmark \
            python/tests/test_v3_benchmark_matrix.py \
            python/tests/test_v3_benchmark_executable_gate.py \
            scripts/generate_v3_benchmark_manifest.py
      - name: Benchmark strict types
        working-directory: python
        run: mypy src/fl_platform/benchmark
      - name: Benchmark v3 tests
        working-directory: python
        run: |
          pytest -q \
            tests/test_v3_benchmark_matrix.py \
            tests/test_v3_benchmark_executable_gate.py
      - name: Generate CI matrix manifest
        run: |
          python scripts/generate_v3_benchmark_manifest.py \
            --profile ci \
            --output artifacts/v3-benchmark-ci-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/v3-benchmark-ci-manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload['evidence_complete'] is not False:
              raise SystemExit('matrix specification must not masquerade as evidence')
          if payload['runnable_cells'] <= 0:
              raise SystemExit('benchmark manifest contains no runnable cells')
          if payload['excluded_cells'] <= 0:
              raise SystemExit('benchmark manifest did not exercise fail-closed exclusions')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-benchmark-ci-manifest
          path: artifacts/v3-benchmark-ci-manifest.json
          retention-days: 14
