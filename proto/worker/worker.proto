syntax = "proto3";

package fl.worker.v1;

option go_package = "github.com/smshagor-dev/federated-learning-super-system/go/generated/worker/v1;workerv1";

import "privacy/privacy.proto";

message TensorManifest {
  string name = 1;
  repeated uint64 shape = 2;
  string dtype = 3;
  uint64 byte_length = 4;
  string checksum = 5;
  // Privacy Engineering phase: inline tensor payload — see
  // docs/create-run-wire-mapping.md's "tensor transport" section. Chosen
  // over an artifact-store (MinIO/ArtifactReference) upload/download path
  // as the pragmatic way to let real tensor values (client deltas, SCAFFOLD
  // control variates) actually cross the live gRPC wire; the coordinator
  // does not currently implement any artifact-store client. Row-major,
  // matching `shape`. Empty means "no payload carried in this message"
  // (e.g. a manifest-only TensorManifest describing a tensor whose values
  // are not part of this particular message).
  repeated double values = 6;
}

message ClientTask {
  string run_id = 1;
  uint64 round_id = 2;
  string client_id = 3;
  string model_version = 4;
  string algorithm = 5;
  string dataset_reference = 6;
  string deadline = 7;
  string nonce = 8;
  string trace_id = 9;
  repeated TensorManifest model_manifest = 10;
}

message ClientMetric {
  string name = 1;
  double value = 2;
}

message ClientResult {
  string run_id = 1;
  uint64 round_id = 2;
  string client_id = 3;
  string base_model_version = 4;
  uint64 local_step_count = 5;
  uint64 sample_count = 6;
  string algorithm = 7;
  string update_format = 8;
  repeated TensorManifest tensor_manifest = 9;
  repeated ClientMetric metrics = 10;
  double update_norm = 11;
  string completion_timestamp = 12;
  string nonce = 13;
  string worker_id = 14;
  string trace_id = 15;
}

// ---------------------------------------------------------------------
// the Coordinator Runtime phase additions. Everything above this line is unchanged from
// the Foundation/Aggregation Core phases (field numbers preserved); everything below is new
// messages, not new fields spliced into the messages above, so the
// backward-compatibility guarantee stays trivial to audit.
// ---------------------------------------------------------------------

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_REGISTERING = 1;
  WORKER_STATUS_IDLE = 2;
  WORKER_STATUS_BUSY = 3;
  WORKER_STATUS_UNHEALTHY = 4;
  WORKER_STATUS_DISCONNECTED = 5;
  WORKER_STATUS_DRAINING = 6;
}

message WorkerCapability {
  string device = 1;
  uint32 cpu_count = 2;
  bool gpu_available = 3;
  uint32 gpu_count = 4;
  uint64 available_memory_bytes = 5;
  repeated string supported_model_formats = 6;
  repeated string supported_algorithms = 7;
  fl.privacy.v1.WorkerPrivacyCapabilities privacy = 8;
}

message SignedCapabilityStatement {
  uint32 schema_version = 1;
  string worker_id = 2;
  string software_version = 3;
  string build_id = 4;
  repeated string supported_algorithms = 5;
  repeated string supported_privacy_modes = 6;
  string opacus_version = 7;
  bool secure_random_available = 8;
  repeated string supported_accountants = 9;
  repeated string supported_clipping_modes = 10;
  repeated string supported_models = 11;
  repeated string supported_model_schema_hashes = 12;
  uint64 maximum_task_bytes = 13;
  uint64 maximum_private_batch_size = 14;
  uint32 cpu_count = 15;
  bool gpu_available = 16;
  uint32 gpu_count = 17;
  double issued_at = 18;
  double expires_at = 19;
  string nonce = 20;
  string signing_key_id = 21;
  string signing_public_key = 22;
  string payload_hash = 23;
  string signature = 24;
}

// One authoritative application-level signed envelope for worker-originated
// security-sensitive RPCs. Domain payloads stay in their sibling request
// messages; payload_hash binds the canonical domain payload.
message SignedWorkerEnvelope {
  enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    MESSAGE_TYPE_WORKER_HEARTBEAT = 1;
    MESSAGE_TYPE_TASK_ACQUISITION = 2;
    MESSAGE_TYPE_TASK_ACCEPTANCE = 3;
    MESSAGE_TYPE_TASK_PROGRESS = 4;
    MESSAGE_TYPE_CLIENT_RESULT = 5;
    MESSAGE_TYPE_TASK_FAILURE = 6;
    MESSAGE_TYPE_SAMPLE_PRIVACY_RECORD = 7;
    MESSAGE_TYPE_PERSONALIZATION_METRICS = 8;
    MESSAGE_TYPE_WORKER_DRAIN = 9;
    MESSAGE_TYPE_WORKER_SHUTDOWN = 10;
    MESSAGE_TYPE_KEY_ROTATION_REQUEST = 11;
    MESSAGE_TYPE_SECURITY_EVENT_BATCH = 12;
    MESSAGE_TYPE_SECURE_AGGREGATION_KEY_ADVERTISEMENT = 13;
    MESSAGE_TYPE_SECURE_AGGREGATION_MASKED_UPDATE = 14;
    // v3 threshold-dropout recovery. A recovery share is not a masked
    // model update and therefore gets a distinct message type even though
    // both belong to the secure-aggregation category stream.
    MESSAGE_TYPE_SECURE_AGGREGATION_RECOVERY_SHARE = 15;
  }

  enum MessageStream {
    MESSAGE_STREAM_UNSPECIFIED = 0;
    MESSAGE_STREAM_CONTROL = 1;
    MESSAGE_STREAM_HEARTBEAT = 2;
    MESSAGE_STREAM_TASK_LIFECYCLE = 3;
    MESSAGE_STREAM_CLIENT_RESULT = 4;
    MESSAGE_STREAM_PRIVACY_RECORD = 5;
    MESSAGE_STREAM_PERSONALIZATION = 6;
    MESSAGE_STREAM_KEY_MANAGEMENT = 7;
    MESSAGE_STREAM_SECURITY_EVENTS = 8;
    // Wire category for secure aggregation. Coordinator replay protection
    // intentionally splits key advertisement, masked update, and recovery
    // share into independent internal sequence tracks because workers keep
    // independent counters for those message types.
    MESSAGE_STREAM_SECURE_AGGREGATION = 9;
  }

  uint32 schema_version = 1;
  MessageType message_type = 2;
  string worker_id = 3;
  string run_id = 4;
  uint64 round_id = 5;
  string task_id = 6;
  string client_id = 7;
  string model_version = 8;
  MessageStream message_stream = 9;
  uint64 sequence_number = 10;
  double issued_at = 11;
  double expires_at = 12;
  string nonce = 13;
  string payload_hash = 14;
  string signing_key_id = 15;
  string signature = 16;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  WorkerCapability capability = 2;
  string trace_id = 3;
  SignedCapabilityStatement signed_capability = 4;
}

message RegisterWorkerResponse {
  string worker_id = 1;
  WorkerStatus status = 2;
  uint32 heartbeat_interval_seconds = 3;
  uint32 task_poll_interval_seconds = 4;
}

message WorkerHeartbeatRequest {
  string worker_id = 1;
  WorkerStatus status = 2;
  string current_task_id = 3;
  string trace_id = 4;
  SignedWorkerEnvelope envelope = 5;
}

message WorkerHeartbeatResponse {
  bool acknowledged = 1;
  bool should_disconnect = 2;
  string rejection_code = 3;
}

message WorkerKeyRotationPayload {
  uint32 schema_version = 1;
  string worker_id = 2;
  string current_signing_key_id = 3;
  string new_signing_key_id = 4;
  string new_public_key_hex = 5;
  double new_key_expires_at_unix_s = 6;
  double requested_grace_period_seconds = 7;
}

message WorkerSecurityEventPayload {
  uint32 schema_version = 1;
  string event_type = 2;
  string severity = 3;
  string timestamp = 4;
  string source_component = 5;
  string actor_type = 6;
  string safe_actor_id = 7;
  string subject_type = 8;
  string safe_subject_id = 9;
  string run_id = 10;
  uint64 round_id = 11;
  string task_id = 12;
  string safe_signing_key_id = 13;
  string request_id = 14;
  string trace_id = 15;
  string outcome = 16;
  string reason_code = 17;
  map<string, string> safe_details = 18;
}

message SignedWorkerSecurityEventBatch {
  uint32 schema_version = 1;
  string worker_id = 2;
  repeated WorkerSecurityEventPayload events = 3;
  uint64 queue_depth_hint = 4;
}

// ---------------------------------------------------------------------
// Secure aggregation domain payloads.
// ---------------------------------------------------------------------

enum SecureAggregationProvider {
  SECURE_AGGREGATION_PROVIDER_UNSPECIFIED = 0;
  SECURE_AGGREGATION_PROVIDER_NONE = 1;
  SECURE_AGGREGATION_PROVIDER_SECAGG_NO_DROPOUT_EXPERIMENTAL = 2;
}

enum SecureAggregationMessageType {
  SECURE_AGGREGATION_MESSAGE_TYPE_UNSPECIFIED = 0;
  SECURE_AGGREGATION_MESSAGE_TYPE_KEY_ADVERTISEMENT = 1;
  SECURE_AGGREGATION_MESSAGE_TYPE_MASKED_UPDATE = 2;
  SECURE_AGGREGATION_MESSAGE_TYPE_RECOVERY_SHARE = 3;
}

message SecureAggregationKeyAdvertisement {
  uint32 schema_version = 1;
  string session_id = 2;
  string run_id = 3;
  uint64 round_id = 4;
  string model_version = 5;
  string worker_id = 6;
  string client_id = 7;
  string ephemeral_public_key_x25519 = 8;
  string public_key_fingerprint = 9;
  double issued_at = 10;
  double expires_at = 11;
}

// v3 threshold recovery share. This is secret session material: the
// coordinator may keep it in volatile memory long enough to reconstruct a
// dropped participant's ephemeral X25519 private key, but durable state must
// retain only a commitment/receipt, never share_value_hex itself.
//
// The share is signed by holder_worker_id with a SignedWorkerEnvelope whose
// message_type is MESSAGE_TYPE_SECURE_AGGREGATION_RECOVERY_SHARE. owner_worker_id
// is the missing participant whose ephemeral private key was threshold-shared.
message SecureAggregationRecoveryShare {
  uint32 schema_version = 1;
  string session_id = 2;
  string run_id = 3;
  uint64 round_id = 4;
  string model_version = 5;
  string cohort_commitment = 6;
  string owner_worker_id = 7;
  string holder_worker_id = 8;
  uint32 generation = 9;
  uint32 threshold = 10;
  uint32 total_shares = 11;
  uint32 share_index = 12;
  // Canonical lowercase big-endian field element, no 0x prefix. The
  // configured Mersenne-521 field needs at most 66 bytes / 132 hex chars.
  string share_value_hex = 13;
  string secret_digest = 14;
  uint32 secret_length = 15;
  string field_id = 16;
  double issued_at = 17;
  double expires_at = 18;
}

message SecureAggregationMaskedTensor {
  string tensor_name = 1;
  repeated uint64 masked_values = 2;
  string checksum = 3;
}

message SecureAggregationEncodingStatistics {
  uint64 total_elements = 1;
  double max_quantization_error = 2;
  double mean_quantization_error = 3;
}

message MaskedClientUpdate {
  uint32 schema_version = 1;
  SecureAggregationProvider provider = 2;
  uint32 protocol_version = 3;
  string session_id = 4;
  string run_id = 5;
  uint64 round_id = 6;
  string task_id = 7;
  string lease_id = 8;
  uint32 attempt = 9;
  string worker_id = 10;
  string client_id = 11;
  string model_version = 12;
  string cohort_commitment = 13;
  string tensor_manifest_hash = 14;
  string fixed_point_profile_hash = 15;
  repeated SecureAggregationMaskedTensor masked_tensors = 16;
  uint64 masked_weight = 17;
  string masked_weight_checksum = 18;
  SecureAggregationEncodingStatistics encoding_statistics = 19;
  string sample_privacy_record_hash = 20;
  double issued_at = 21;
  double expires_at = 22;
  string frozen_roster_payload_hash = 23;
  string cryptographic_profile_hash = 24;
  SignedUserLevelPrivacyAttestation user_level_attestation = 25;
  uint64 masked_clipping_indicator = 26;
  string masked_clipping_indicator_checksum = 27;
  SignedAdaptiveClippingBinding adaptive_clipping_binding = 28;
}

message SignedAdaptiveClippingBinding {
  uint32 schema_version = 1;
  string worker_id = 2;
  string client_id = 3;
  string run_id = 4;
  uint64 round_id = 5;
  string task_id = 6;
  string session_id = 7;
  string model_version = 8;
  string adaptive_configuration_hash = 9;
  uint64 clip_state_step_count = 10;
  double current_clip_bound = 11;
  SecureAggregationProvider provider = 12;
  bool operation_completed = 13;
  double issued_at = 14;
  double expires_at = 15;
  string signing_key_id = 16;
  string payload_hash = 17;
  string signature = 18;
}

message SignedUserLevelPrivacyAttestation {
  uint32 schema_version = 1;
  string worker_id = 2;
  string client_id = 3;
  string run_id = 4;
  uint64 round_id = 5;
  string task_id = 6;
  string session_id = 7;
  string model_version = 8;
  fl.privacy.v1.PrivacyMode privacy_mode = 9;
  string privacy_configuration_hash = 10;
  double clip_norm = 11;
  double effective_sensitivity = 12;
  string clipping_strategy = 13;
  uint64 fixed_weight = 14;
  string fixed_point_profile_hash = 15;
  string tensor_manifest_hash = 16;
  SecureAggregationProvider provider = 17;
  bool operation_completed = 18;
  double issued_at = 19;
  double expires_at = 20;
  string signing_key_id = 21;
  string payload_hash = 22;
  string signature = 23;
}
