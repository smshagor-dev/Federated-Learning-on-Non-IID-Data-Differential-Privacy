name: ci lint normalize

on:
  push:
    branches: [ci-lint-stabilization]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff used by current CI
        run: python -m pip install 'ruff==0.16.4'
      - name: Apply safe lint fixes and canonical formatting
        run: |
          ruff check --fix . || true
          ruff format .
          git diff --check
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply canonical Python lint formatting'
          git push origin HEAD:ci-lint-stabilization
