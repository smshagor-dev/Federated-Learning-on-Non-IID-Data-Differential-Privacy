name: IEEE TAI focused archive recovery integrity tests
on:
  push:
    branches: [research/ieee-cifar-raw-archive-recovery]
    paths:
      - scripts/recover_tai_focused_archives.py
      - tests/test_tai_focused_archive_recovery.py
      - .github/workflows/tai-focused-archive-recovery-tests.yml
  pull_request:
    paths:
      - scripts/recover_tai_focused_archives.py
      - tests/test_tai_focused_archive_recovery.py
      - .github/workflows/tai-focused-archive-recovery-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest ruff
      - name: Verify all recovery failure modes
        run: python -m pytest -q tests/test_tai_focused_archive_recovery.py
      - name: Verify audit source and tests Ruff-clean
        run: |
          python -m ruff check scripts/recover_tai_focused_archives.py \
            tests/test_tai_focused_archive_recovery.py
