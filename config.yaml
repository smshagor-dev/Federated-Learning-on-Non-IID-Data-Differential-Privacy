# =============================================================================
# Federated Learning on Non-IID Data with Differential Privacy
# Master experiment configuration
# Any value here can be overridden from the CLI (see main.py --help)
# =============================================================================

system:
  seed: 42                    # Global seed (python random / numpy / torch / cuda)
  device: "auto"              # "auto" | "cuda" | "cpu"
  results_dir: "results"      # CSV logs, plots, manifests and summaries

data:
  dataset: "CIFAR10"          # "CIFAR10" | "MNIST"
  data_root: "./data_raw"     # Download / cache directory for torchvision
  partition: "dirichlet"      # "iid" | "dirichlet" | "pathological" | "quantity_skew"
  alpha: 0.1                  # Used only by dirichlet
  classes_per_client: 2       # Used only by pathological
  quantity_skew_sigma: 1.0    # Log-normal sigma used only by quantity_skew
  min_partition_size: 10      # Minimum samples per client

federated:
  num_clients: 20
  sample_rate: 0.2
  sampling_strategy: "poisson"  # "poisson" | "fixed_without_replacement"
  aggregation_weighting: "uniform"  # "uniform" | "sample_count"
  rounds: 50
  local_epochs: 2
  batch_size: 64
  server_lr: 1.0

optimizer:
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  grad_clip_norm: null

algorithm:
  name: "fedprox"             # "fedavg" | "fedprox" | "scaffold"
  mu: 0.01

dp:
  enabled: true
  update_clip_norm: 1.5
  target_epsilon: 4.0
  epsilon_tolerance: 1.0e-4
  noise_multiplier: 2.163873
  target_delta: 1.0e-5
  deterministic_noise_for_testing: false
  test_noise_seed: null

model:
  name: "cnn"
  group_norm_groups: 2

evaluation:
  eval_batch_size: 256
