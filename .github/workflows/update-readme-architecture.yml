name: Update README architecture diagrams

on:
  push:
    branches:
      - docs-system-architecture-workflow
    paths:
      - .github/workflows/update-readme-architecture.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs-system-architecture-workflow
          fetch-depth: 0

      - name: Add system architecture and workflow diagrams
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old_toc = "- [11. Architecture](#11-architecture)"
          new_toc = "- [11. System architecture](#11-system-architecture)\n- [System workflow](#system-workflow)"
          if text.count(old_toc) != 1:
              raise SystemExit(f"expected one architecture TOC entry, found {text.count(old_toc)}")
          text = text.replace(old_toc, new_toc, 1)

          start_marker = "## 11. Architecture\n"
          end_marker = "\n---\n\n## 12. Installation"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate README architecture section boundaries")

          replacement_b64 = ""
          replacement = base64.b64decode(replacement_b64).decode("utf-8")
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          updated = path.read_text(encoding="utf-8")
          checks = {
              "system architecture heading": "## 11. System architecture" in updated,
              "system workflow heading": "## System workflow" in updated,
              "architecture TOC": "[11. System architecture](#11-system-architecture)" in updated,
              "workflow TOC": "[System workflow](#system-workflow)" in updated,
              "mermaid diagrams": updated.count("```mermaid") >= 6,
              "old heading removed": "## 11. Architecture\n" not in updated,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("README validation failed: " + ", ".join(failed))
          print("README architecture/workflow patch validated")
          PY

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          python scripts/validate_repository_docs.py

      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Shahanur Islam Shagor"
          git config user.email "smshagor.ru@gmail.com"
          git add README.md
          git rm .github/workflows/update-readme-architecture.yml
          git commit -m "Document system architecture and workflow"
          git push origin HEAD:docs-system-architecture-workflow
