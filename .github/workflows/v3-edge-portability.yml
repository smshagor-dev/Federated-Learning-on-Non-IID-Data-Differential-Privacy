name: v3 edge portability

on:
  pull_request:
    branches: [main]
    paths:
      - "python/src/fl_platform/v3/edge_runtime.py"
      - "python/tests/test_v3_edge_runtime.py"
      - "infra/docker/python-edge-runtime.Dockerfile"
      - ".github/workflows/v3-edge-portability.yml"
  push:
    branches: [edge-worker-runtime]

concurrency:
  group: v3-edge-portability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e './python[dev]'
      - name: Edge runtime tests
        working-directory: python
        run: pytest -q tests/test_v3_edge_runtime.py

  edge-arm64-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 edge runtime image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file infra/docker/python-edge-runtime.Dockerfile \
            --output type=oci,dest=/tmp/fl-platform-edge-arm64.tar \
            .
      - name: Verify ARM64 OCI artifact exists
        run: test -s /tmp/fl-platform-edge-arm64.tar
