name: v3 async runtime

on:
  push:
    branches:
      - async-runtime-recovery
    paths:
      - "python/src/fl_platform/v3/async_*.py"
      - "python/tests/test_v3_async_durability.py"
      - ".github/workflows/v3-async-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python/src/fl_platform/v3/async_*.py"
      - "python/tests/test_v3_async_durability.py"
      - ".github/workflows/v3-async-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-async-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and validation tools
        run: python -m pip install -e "./python[dev]"
      - name: Compile async runtime
        run: |
          python -m compileall -q \
            python/src/fl_platform/v3/async_runtime.py \
            python/src/fl_platform/v3/async_checkpoint.py \
            python/src/fl_platform/v3/async_execution.py \
            python/src/fl_platform/v3/async_membership.py
      - name: Async runtime lint
        run: |
          ruff check \
            python/src/fl_platform/v3/async_runtime.py \
            python/src/fl_platform/v3/async_checkpoint.py \
            python/src/fl_platform/v3/async_execution.py \
            python/src/fl_platform/v3/async_membership.py
      - name: Async runtime formatting
        run: |
          ruff format --check \
            python/src/fl_platform/v3/async_runtime.py \
            python/src/fl_platform/v3/async_checkpoint.py \
            python/src/fl_platform/v3/async_execution.py \
            python/src/fl_platform/v3/async_membership.py \
            python/tests/test_v3_async_durability.py
      - name: Async runtime strict types
        run: |
          python -m mypy --config-file=python/pyproject.toml \
            python/src/fl_platform/v3/async_runtime.py \
            python/src/fl_platform/v3/async_checkpoint.py \
            python/src/fl_platform/v3/async_execution.py \
            python/src/fl_platform/v3/async_membership.py
      - name: Async durability and replay tests
        run: |
          python -m pytest \
            python/tests/test_v3_async_durability.py \
            python/tests/test_v3_foundations.py \
            python/tests/test_v3_runtime_integration.py
