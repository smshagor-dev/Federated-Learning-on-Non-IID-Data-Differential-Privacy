name: v3 release candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "RELEASE_PLAN_v3.0.0.md"
      - "RELEASE_NOTES_v3.0.0.md"
      - "release/**"
      - "python/pyproject.toml"
      - "python/src/fl_platform/__init__.py"
      - "python/src/fl_platform/v3/**"
      - "python/src/fl_platform/benchmark/**"
      - "python/src/fl_platform/secure_aggregation/**"
      - "python/tests/test_v3_*.py"
      - "python/tests/test_secure_aggregation_*.py"
      - "scripts/generate_v3_benchmark_manifest.py"
      - "scripts/run_v3_chaos_soak.py"
      - "scripts/validate_v3_infrastructure.py"
      - "infra/docker/**"
      - "infra/kubernetes/**"
      - ".github/workflows/v3-release-candidate.yml"
      - ".github/workflows/v3-final-qualification.yml"
      - ".github/workflows/v3-release-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "RELEASE_PLAN_v3.0.0.md"
      - "RELEASE_NOTES_v3.0.0.md"
      - "release/**"
      - "python/pyproject.toml"
      - "python/src/fl_platform/__init__.py"
      - "python/src/fl_platform/v3/**"
      - "python/src/fl_platform/benchmark/**"
      - "python/src/fl_platform/secure_aggregation/**"
      - "python/tests/test_v3_*.py"
      - "python/tests/test_secure_aggregation_*.py"
      - "scripts/generate_v3_benchmark_manifest.py"
      - "scripts/run_v3_chaos_soak.py"
      - "scripts/validate_v3_infrastructure.py"
      - "infra/docker/**"
      - "infra/kubernetes/**"
      - ".github/workflows/v3-release-candidate.yml"
      - ".github/workflows/v3-final-qualification.yml"
      - ".github/workflows/v3-release-artifacts.yml"
  workflow_dispatch:

concurrency:
  group: v3-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install v3 validation dependencies
        run: |
          python -m pip install -e './python[dev,security]'
          # masked_update.py is a real Torch runtime and the secure-aggregation
          # release tests import/use it directly. Match the worker container's
          # CPU-only dependency instead of relying on a preinstalled runner copy.
          python -m pip install 'torch>=2.0.0' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile v3 release surface
        run: |
          python -m compileall -q \
            python/src/fl_platform/v3 \
            python/src/fl_platform/benchmark \
            python/src/fl_platform/secure_aggregation
      - name: Lint release surface
        run: |
          ruff check \
            python/src/fl_platform/v3 \
            python/src/fl_platform/benchmark \
            python/src/fl_platform/secure_aggregation \
            python/tests/test_v3_*.py \
            python/tests/test_secure_aggregation_*.py \
            scripts/generate_v3_benchmark_manifest.py \
            scripts/run_v3_chaos_soak.py \
            scripts/validate_v3_infrastructure.py
      - name: Format release surface
        run: |
          ruff format --check \
            python/src/fl_platform/v3 \
            python/src/fl_platform/benchmark \
            python/src/fl_platform/secure_aggregation \
            python/tests/test_v3_*.py \
            python/tests/test_secure_aggregation_*.py \
            scripts/generate_v3_benchmark_manifest.py \
            scripts/run_v3_chaos_soak.py \
            scripts/validate_v3_infrastructure.py
      - name: Strict type validation
        run: |
          python -m mypy --config-file=python/pyproject.toml \
            python/src/fl_platform/v3 \
            python/src/fl_platform/benchmark \
            python/src/fl_platform/secure_aggregation/threshold_recovery.py \
            python/src/fl_platform/secure_aggregation/dropout_recovery.py \
            python/src/fl_platform/secure_aggregation/recovery_wire.py \
            python/src/fl_platform/secure_aggregation/recovery_runtime.py \
            python/src/fl_platform/secure_aggregation/share_relay.py
      - name: Run v3 and secure-aggregation release tests
        run: |
          python -m pytest -q \
            python/tests/test_v3_*.py \
            python/tests/test_secure_aggregation_*.py
      - name: Generate benchmark matrix specification
        run: |
          mkdir -p artifacts
          python scripts/generate_v3_benchmark_manifest.py \
            --profile ci \
            --output artifacts/v3-benchmark-ci-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('artifacts/v3-benchmark-ci-manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          if payload['evidence_complete'] is not False:
              raise SystemExit('benchmark specification masquerades as evidence')
          if payload['runnable_cells'] <= 0:
              raise SystemExit('benchmark matrix contains no runnable cells')
          if payload['excluded_cells'] <= 0:
              raise SystemExit('benchmark matrix did not prove fail-closed exclusions')
          PY
      - name: Run release-candidate chaos soak
        run: |
          python scripts/run_v3_chaos_soak.py \
            --seeds 500 \
            --clients 64 \
            --output artifacts/v3-chaos-release-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('artifacts/v3-chaos-release-candidate.json').read_text(
                  encoding='utf-8'
              )
          )
          if payload['invariant_failures'] != 0:
              raise SystemExit('release-candidate chaos soak failed invariants')
          if (
              payload['recovered_clients']
              + payload['dropped_clients']
              + payload['failed_clients']
              != payload['selected_clients']
          ):
              raise SystemExit('release-candidate chaos accounting mismatch')
          PY
      - name: Validate Kubernetes production contract
        run: python scripts/validate_v3_infrastructure.py
      - name: Write software evidence summary
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path('python/pyproject.toml').read_text(encoding='utf-8')
          )['project']['version']
          payload = {
              'schema_version': 1,
              'commit_sha': os.environ['RELEASE_CANDIDATE_SHA'].lower(),
              'package_version': version,
              'software_candidate_gates_passed': [
                  'async-runtime-durability',
                  'robust-aggregation-unit',
                  'privacy-validation-unit',
                  'secure-aggregation-recovery-unit',
                  'algorithm-suite-unit',
                  'system-heterogeneity-unit',
                  'federated-workloads-contract',
                  'observability-contract',
                  'benchmark-matrix-contract',
                  'edge-runtime-unit',
                  'chaos-deterministic-soak',
                  'distributed-infrastructure-contract',
              ],
              'scope': (
                  'CI software release-candidate evidence only; this artifact does '
                  'not claim physical-device or independent multi-host validation.'
              ),
          }
          Path('artifacts/v3-release-candidate-software-evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-release-candidate-software-evidence
          path: |
            artifacts/v3-benchmark-ci-manifest.json
            artifacts/v3-chaos-release-candidate.json
            artifacts/v3-release-candidate-software-evidence.json
          if-no-files-found: error
          retention-days: 30

  cpp-live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler protobuf-compiler-grpc libprotobuf-dev \
            libgrpc++-dev libssl-dev pkg-config
      - name: Generate protobuf and gRPC bindings
        run: bash scripts/generate_protos.sh generated
      - name: Configure release recovery build
        run: cmake -S cpp -B build/cpp-release-candidate -DCMAKE_BUILD_TYPE=Release
      - name: Build live recovery targets
        run: |
          cmake --build build/cpp-release-candidate --target \
            fl_coordinator_grpc_server \
            fl_coordinator_grpc_tests \
            fl_secure_aggregation_session_manager_tests \
            -j"$(nproc)"
      - name: Run recovery coordinator tests
        run: |
          ctest --test-dir build/cpp-release-candidate --output-on-failure -R \
            '^(fl_coordinator_grpc_tests|fl_secure_aggregation_session_manager_tests)$'

  edge-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 edge OCI artifact
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file infra/docker/python-edge-runtime.Dockerfile \
            --output type=oci,dest=/tmp/fl-platform-edge-arm64.tar \
            .
          test -s /tmp/fl-platform-edge-arm64.tar

  release-container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build release API image
        run: docker build -f infra/docker/go-api.Dockerfile -t fl-platform/api:rc .
      - name: Build release Python worker image
        run: docker build -f infra/docker/python-worker.Dockerfile -t fl-platform/python-worker:rc .
