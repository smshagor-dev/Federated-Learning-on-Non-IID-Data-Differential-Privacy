syntax = "proto3";

package fl.recovery.v1;

option go_package = "github.com/smshagor-dev/federated-learning-super-system/go/generated/recovery/v1;recoveryv1";

import "worker/worker.proto";

// Worker-authenticated share submission. The SignedWorkerEnvelope must use
// MESSAGE_TYPE_SECURE_AGGREGATION_RECOVERY_SHARE and its payload_hash must be
// SHA-256 of the canonical recovery-share payload. Raw share values are
// volatile coordinator memory only; durable recovery state stores commitment
// receipts, never share_value_hex.
message SubmitRecoveryShareRequest {
  fl.worker.v1.SignedWorkerEnvelope envelope = 1;
  fl.worker.v1.SecureAggregationRecoveryShare recovery_share = 2;
}

message SubmitRecoveryShareResponse {
  bool accepted = 1;
  string rejection_code = 2;
  string reason = 3;
  uint32 submitted_share_count = 4;
  uint32 threshold = 5;
  bool recoverable = 6;
  bool recovery_applied = 7;
  bool round_advanced = 8;
}

// Read-only operational status. No raw share, reconstructed private key, mask
// correction, tensor value, or client update is ever returned.
message GetRecoveryStatusRequest {
  string session_id = 1;
  string owner_worker_id = 2;
  uint32 generation = 3;
}

message RecoveryShareReceiptSummary {
  string holder_worker_id = 1;
  uint32 share_index = 2;
  string share_commitment = 3;
}

message GetRecoveryStatusResponse {
  bool found = 1;
  string session_id = 2;
  string owner_worker_id = 3;
  uint32 generation = 4;
  uint32 submitted_share_count = 5;
  uint32 threshold = 6;
  bool recoverable = 7;
  bool recovered = 8;
  bool recovery_applied = 9;
  repeated RecoveryShareReceiptSummary receipts = 10;
  string state = 11;
}

// End-to-end encrypted owner->holder recovery-share package. The coordinator
// validates the owner's SignedWorkerEnvelope and frozen-cohort bindings but has
// no field containing the raw Shamir value. nonce_hex is a 12-byte
// ChaCha20-Poly1305 nonce, ciphertext_hex is the fixed 66-byte field element
// plus the 16-byte Poly1305 tag, and ciphertext_hash is SHA-256 over those
// ciphertext bytes.
message EncryptedRecoveryShareRelay {
  uint32 schema_version = 1;
  string session_id = 2;
  string run_id = 3;
  uint64 round_id = 4;
  string model_version = 5;
  string cohort_commitment = 6;
  string owner_worker_id = 7;
  string holder_worker_id = 8;
  uint32 generation = 9;
  uint32 threshold = 10;
  uint32 total_shares = 11;
  uint32 share_index = 12;
  string secret_digest = 13;
  uint32 secret_length = 14;
  string field_id = 15;
  string nonce_hex = 16;
  string ciphertext_hex = 17;
  string ciphertext_hash = 18;
  double issued_at = 19;
  double expires_at = 20;
}

message PublishRecoveryShareRelayRequest {
  // Must use MESSAGE_TYPE_SECURE_AGGREGATION_RECOVERY_RELAY and be signed by
  // encrypted_share.owner_worker_id's ACTIVE/GRACE_PERIOD Ed25519 key.
  fl.worker.v1.SignedWorkerEnvelope envelope = 1;
  EncryptedRecoveryShareRelay encrypted_share = 2;
}

message PublishRecoveryShareRelayResponse {
  bool accepted = 1;
  string rejection_code = 2;
  string reason = 3;
}

// Holder-authenticated mailbox read. The live C++ service exposes this RPC only
// on an mTLS-required listener and checks the certificate URI SAN against
// holder_worker_id before returning ciphertext addressed to that holder.
message FetchRecoveryShareRelaysRequest {
  string holder_worker_id = 1;
  string session_id = 2;
  uint32 max_items = 3;
}

message FetchRecoveryShareRelaysResponse {
  repeated EncryptedRecoveryShareRelay encrypted_shares = 1;
}

service SecureAggregationRecoveryService {
  rpc SubmitRecoveryShare(SubmitRecoveryShareRequest) returns (SubmitRecoveryShareResponse);
  rpc GetRecoveryStatus(GetRecoveryStatusRequest) returns (GetRecoveryStatusResponse);
}

service SecureAggregationShareRelayService {
  rpc PublishRecoveryShareRelay(PublishRecoveryShareRelayRequest) returns (PublishRecoveryShareRelayResponse);
  rpc FetchRecoveryShareRelays(FetchRecoveryShareRelaysRequest) returns (FetchRecoveryShareRelaysResponse);
}
