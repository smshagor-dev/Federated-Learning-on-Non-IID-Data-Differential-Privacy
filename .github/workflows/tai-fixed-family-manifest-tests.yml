name: IEEE TAI fixed-family manifest regression tests
on:
  push:
    branches:
      - research/tai-fixed-family-receipt-gate-20261120
    paths:
      - research/tai_confirmatory_manifest_gate.py
      - tests/test_tai_confirmatory_manifest_gate.py
      - .github/workflows/tai-fixed-family-manifest-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-family-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run strict manifest-gate regressions
        run: python -m unittest discover -s tests -p 'test_tai_confirmatory_manifest_gate.py' -v
