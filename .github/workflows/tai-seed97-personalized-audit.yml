name: IEEE TAI independent seed97 personalized archive audit
on:
  push:
    branches: [research/seed97-personalized-evidence-audit]
    paths: [.github/workflows/tai-seed97-personalized-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tai-seed97-personalized-evidence-audit
  cancel-in-progress: false
jobs:
  independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm original 50-round personalized training succeeded
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43649657434" --jq '.status + " " + (.conclusion // "pending")')" = "completed success"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43649657434/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("train (")) | .conclusion] | length == 4 and all(. == "success")' | grep -qx true
      - name: Download all four original metrics and checkpoint archives
        run: |
          set -euo pipefail
          mkdir -p audit/input/metrics audit/input/models
          for dataset in CIFAR10 CIFAR100; do
            for method in ditto per_fedavg; do
              suffix="${dataset}-${method}-seed97"
              metrics="ieee-tai-focus-evidence-${suffix}"
              models="ieee-tai-focus-models-${suffix}"
              mkdir -p "audit/input/metrics/${metrics}" "audit/input/models/${models}"
              gh run download 43649657434 --repo "$GITHUB_REPOSITORY" --name "$metrics" --dir "audit/input/metrics/$metrics"
              gh run download 43649657434 --repo "$GITHUB_REPOSITORY" --name "$models" --dir "audit/input/models/$models"
            done
          done
      - name: Recover original checkpoints and independently verify SHA256
        run: |
          python scripts/recover_tai_focused_archives.py audit/input/metrics audit/input/models --seed 97 --methods ditto per_fedavg --output audit/recovered-seed97-personalized.json
      - name: Install verification dependencies
        run: |
          python -m pip install 'numpy==2.4.6' 'torch==2.15.0' 'torchvision==0.29.2' 'pyyaml==6.0.3'
      - name: Independently verify exact primary 50-round protocol and identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_tai_primary_collection import collect
          rows, report = collect([Path("audit/input/metrics")])
          assert report["primary"]["verified"] == 4, report
          assert report["rq4_derived"]["verified"] == 0, report
          primary = [r for r in rows if r["evidence_type"] == "50-round-primary"]
          assert {(r["dataset"], r["method"], int(r["seed"])) for r in primary} == {
              (dataset, method, 97)
              for dataset in ("CIFAR10", "CIFAR100")
              for method in ("ditto", "per_fedavg")
          }, primary
          assert {r["condition"] for r in primary} == {"dirichlet:0.1"}
          assert {r["source_commit_sha"] for r in primary} == {
              "a6641509c2b8e6557101499db553177d70a6a3e2"
          }
          assert len({r["run_id"] for r in primary}) == 4
          Path("audit/coverage-seed97-personalized.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          Path("audit/verified-seed97-personalized.json").write_text(
              json.dumps(primary, indent=2, sort_keys=True) + "\n"
          )
          print("SEED97_PERSONALIZED_AUDIT_SUCCESS: four distinct primary cells")
          PY
      - name: Archive independent evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee-tai-seed97-personalized-independent-audit
          path: |
            audit/recovered-seed97-personalized.json
            audit/coverage-seed97-personalized.json
            audit/verified-seed97-personalized.json
          if-no-files-found: warn
          retention-days: 90
