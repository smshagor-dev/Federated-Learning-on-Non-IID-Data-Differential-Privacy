name: Smoke live FL simulator CPU

on:
  push:
    branches:
      - document-training-dataflow-live-simulator
    paths:
      - .github/workflows/smoke-live-simulator-cpu.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: document-training-dataflow-live-simulator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU simulator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run real simulator smoke and focused pytest
        run: |
          python scripts/live_fl_simulator.py --smoke
          python -m pytest -q tests/test_live_fl_simulator.py
      - name: Remove temporary smoke workflows
        if: success()
        run: |
          git config user.name "Shahanur Islam Shagor"
          git config user.email "smshagor.ru@gmail.com"
          git pull --ff-only origin document-training-dataflow-live-simulator
          git rm -f .github/workflows/smoke-live-simulator.yml .github/workflows/smoke-live-simulator-cpu.yml
          git commit -m "Remove temporary live simulator smoke workflows"
          git push origin HEAD:document-training-dataflow-live-simulator
