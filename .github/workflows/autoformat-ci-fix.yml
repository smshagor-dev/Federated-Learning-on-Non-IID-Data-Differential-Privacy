name: autoformat-ci-fix

on:
  push:
    branches:
      - agent/fix-ci-failures

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-failures
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          python -m pip install 'ruff>=0.6,<1'
      - name: Apply formatting fixes
        run: |
          clang-format -i $(find cpp -name '*.cpp' -o -name '*.hpp')
          gofmt -w go
          python -m ruff check . --fix
          python -m ruff format .
          rm -f .github/ci-diagnostics-trigger.txt
          rm -f .github/workflows/autoformat-ci-fix.yml
      - name: Commit formatting fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix CI formatting failures'
          git push origin HEAD:agent/fix-ci-failures
